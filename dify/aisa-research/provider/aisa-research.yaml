identity:
  author: aisa-plugins
  name: aisa-research
  label:
    en_US: AISA Research
    zh_Hans: AISA 研究
  description:
    en_US: Research the web, X/Twitter, YouTube, and scholarly literature with AISA.
    zh_Hans: 使用 AISA 研究网页、X/Twitter、YouTube 和学术文献。
  icon: icon.svg
  tags:
    - search
    - productivity
credentials_for_provider:
  aisa_api_key:
    type: secret-input
    required: true
    label:
      en_US: AISA API Key
      zh_Hans: AISA API 密钥
    placeholder:
      en_US: Enter your AISA API key
      zh_Hans: 请输入 AISA API 密钥
    help:
      en_US: Get an API key from the AISA Console.
      zh_Hans: 从 AISA Console 获取 API 密钥。
    url: https://console.aisa.one
tools:
  - tools/web_search.yaml
  - tools/web_extract.yaml
  - tools/twitter_search.yaml
  - tools/youtube_search.yaml
  - tools/scholar_search.yaml
extra:
  python:
    source: provider/aisa-research.py
