identity:
  author: aisa-plugins
  name: aisa-search
  label:
    en_US: AIsa Search
    zh_Hans: AIsa 搜索
  description:
    en_US: Search the web, X/Twitter, YouTube, and scholarly literature with AIsa.
    zh_Hans: 使用 AIsa 搜索网页、X/Twitter、YouTube 和学术文献。
  icon: aisa-logo.png
  tags:
    - search
    - productivity
credentials_for_provider:
  aisa_api_key:
    type: secret-input
    required: true
    label:
      en_US: AIsa API Key
      zh_Hans: AIsa API 密钥
    placeholder:
      en_US: Enter your AIsa API key
      zh_Hans: 请输入 AIsa API 密钥
    help:
      en_US: Get an API key from the AIsa Console.
      zh_Hans: 从 AIsa Console 获取 API 密钥。
    url: https://console.aisa.one
tools:
  - tools/web_search.yaml
  - tools/web_extract.yaml
  - tools/twitter_search.yaml
  - tools/youtube_search.yaml
  - tools/scholar_search.yaml
extra:
  python:
    source: provider/aisa-search.py
